<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; img-src 'self' file:; font-src 'self' file:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Mouka Driver</title>
<link rel="stylesheet" href="driver.css">
<script defer src="driver.js"></script>
</head>
<body>
<header id="topbar" class="top">
  <button type="button" id="back" aria-label="Back" hidden>&#8592;</button>
  <img src="mouka.svg" alt="Mouka"><strong id="title">Home</strong>
  <span class="preview">Demo trips</span>
</header>
<main><div id="screen"><p>Loading trips…</p></div></main>
<footer id="dock" hidden></footer>
<nav id="tabs" aria-label="App sections" hidden></nav>
<dialog id="confirm">
  <h2 id="confirmTitle"></h2><p id="confirmText"></p>
  <div class="dialogActions"><button id="cancel" class="button">Cancel</button><button id="approve" class="button primary"></button></div>
</dialog>
<p id="toast" role="status" aria-live="polite" hidden></p>
<p id="notice" role="status" aria-live="polite" hidden></p>
</body>
</html>
